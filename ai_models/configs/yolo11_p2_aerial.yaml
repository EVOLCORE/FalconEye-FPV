# FalconEye FPV - YOLO11-Aerial with P2 Small-Object Detection Head
# Specialized for micro-targets in drone and FPV aerial imagery

# Parameters
nc: 10  # Number of classes in VisDrone (pedestrian, people, bicycle, car, van, truck, tricycle, awning-tricycle, bus, motor)
scales: # YOLO11n-Aerial (Nano configuration for high FPS on Edge AI)
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2  (320x320)
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4  (160x160)
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2       (160x160)
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8  (80x80)
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4       (80x80)
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16 (40x40)
  - [-1, 2, C3k2, [512, True]]         # 6       (40x40)
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32 (20x20)
  - [-1, 2, C3k2, [1024, True]]        # 8       (20x20)
  - [-1, 1, SPPF, [1024, 5]]           # 9       (20x20)
  - [-1, 2, C2PSA, [1024]]             # 10      (20x20)

# Head with P2 Layer Integration (4 heads: P2, P3, P4, P5)
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11 (40x40)
  - [[-1, 6], 1, Concat, [1]]                  # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]]                # 13 (40x40)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14 (80x80)
  - [[-1, 4], 1, Concat, [1]]                  # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]]                # 16 (80x80)

  # P2 Upsample layer for tiny targets
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 17 (160x160)
  - [[-1, 2], 1, Concat, [1]]                  # 18 cat backbone P2 (160x160)
  - [-1, 2, C3k2, [128, False]]                # 19 (160x160) - P2 Small Target Output!

  - [-1, 1, Conv, [128, 3, 2]]                 # 20 (80x80)
  - [[-1, 16], 1, Concat, [1]]                 # 21 cat head P3
  - [-1, 2, C3k2, [256, False]]                # 22 (80x80) - P3 Medium Target Output

  - [-1, 1, Conv, [256, 3, 2]]                 # 23 (40x40)
  - [[-1, 13], 1, Concat, [1]]                 # 24 cat head P4
  - [-1, 2, C3k2, [512, False]]                # 25 (40x40) - P4 Large Target Output

  - [-1, 1, Conv, [512, 3, 2]]                 # 26 (20x20)
  - [[-1, 10], 1, Concat, [1]]                 # 27 cat head P5
  - [-1, 2, C3k2, [1024, True]]                # 28 (20x20) - P5 Extra-Large Target Output

  - [[19, 22, 25, 28], 1, Detect, [nc]]        # 29 Detect(P2, P3, P4, P5)
